name: Build Android APK (Offline Qwen SLM)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android NDK & Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Ensure NDK and CMake are installed
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Scaffold React Native Project
        run: |
          npx -y @react-native-community/cli init BrightPathApp --skip-install --skip-git-init --pm npm
          cp -r mobile_app/src BrightPathApp/src
          cp -r mobile_app/assets BrightPathApp/assets
          cp mobile_app/App.js BrightPathApp/App.js

      - name: Configure Android for High-Memory SLM
        run: |
          python3 -c "
          # 1. Enable largeHeap in AndroidManifest.xml
          manifest_path = 'BrightPathApp/android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = f.read()
          if 'android:largeHeap' not in manifest:
              manifest = manifest.replace('<application', '<application android:largeHeap=\"true\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(manifest)
          print('largeHeap enabled in manifest.')

          # 2. Add noCompress 'gguf' to android/app/build.gradle
          gradle_path = 'BrightPathApp/android/app/build.gradle'
          with open(gradle_path, 'r', encoding='utf-8') as f:
              gradle = f.read()
          if 'noCompress' not in gradle:
              gradle = gradle.replace('android {', 'android {\n    aaptOptions { noCompress \"gguf\" }')
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(gradle)
          print('noCompress gguf added to build.gradle.')
          "

      - name: Download Qwen 2.5 0.5B GGUF Model (~390 MB) into App Assets
        run: |
          mkdir -p BrightPathApp/android/app/src/main/assets
          curl -L -o BrightPathApp/android/app/src/main/assets/model.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -lh BrightPathApp/android/app/src/main/assets/model.gguf

      - name: Install App Dependencies & llama.rn
        working-directory: BrightPathApp
        run: |
          npm install
          npm install llama.rn@0.12.9

      - name: Patch llama.rn Android Native Asset Loader
        run: python3 patch_llama.py

      - name: Pre-bundle Standalone Offline JavaScript (No Metro Needed)
        working-directory: BrightPathApp
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: Build Android Standalone APK
        working-directory: BrightPathApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp BrightPathApp/android/app/build/outputs/apk/debug/app-debug.apk ./BrightPath-Qwen-Offline.apk
          ls -lh ./BrightPath-Qwen-Offline.apk

      - name: Upload Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightPath-Qwen-Offline-App
          path: ./BrightPath-Qwen-Offline.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (Direct Mobile Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.4
          name: English Class 9 AI Assistant v2.4 (All Book-Back & End-of-Lesson Exercises)
          body: |
            ### 📱 English Class 9 AI Assistant (Qwen 2.5 0.5B SLM) - v2.4

            - **Zero 'Not mentioned in the book' Errors**: Relaxed domain search filters and neural prompt safeguards ensure every textbook exercise question is answered directly with textbook grounding.
            - **All End-of-Lesson Exercises Answered**:
              - **Stopping by Woods on a Snowy Evening (Page 20)**: Summary 14 fill-in-the-blanks, rhyme schemes (`aaba bbcb ccdc dddd`), poetic devices, and stanza comprehension.
              - **The Fun They Had (Page 47-48)**: Character identification, 13-clue paragraph completion, and sentence completions.
              - **A Poison Tree (Page 40-41)**: Summary 5 blanks, apple significance, foe outstretched, and rhyme scheme `aabb`.
              - **On Killing a Tree (Page 77-78)**: Summary blanks, anchoring earth, bleeding bark, and root uprooting.
              - **Earthquake (Page 86)**: 5 fill-in-the-blanks (Brij, 670 villages, school books, makeshift hospital, 116 hours), MCQs, and character lines.
              - **The Cat and the Pain-Killer (Page 113-114)**: Sentence rearrangement 1-8 sequence (`5, 8, 1, 7, 3, 4, 6, 2`), 12-word summary box blanks, short Q&A, and American slang table.
              - **Old Man River (Page 59-61)**: MCQs (`a, b, c, d`), 10-character matching table, and dictionary synonyms/antonyms.
              - **Seventeen Oranges (Page 93-97)**: Synonyms MCQs, Antonyms MCQs, Nicholas Scotti MCQs, and phrasal verbs dictionary meanings.
              - **Water – The Elixir of Life (Page 118-122)**: Complete in-text margin questions (all 15 items).
            - **Interactive Directory & Direct Answer Cards**: Direct answer banners, green badges, option cards, and page citations.
            - **100% Offline Standalone APK**: Pre-bundled JavaScript and Qwen 0.5B GGUF model (~688 MB).
          files: ./BrightPath-Qwen-Offline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
