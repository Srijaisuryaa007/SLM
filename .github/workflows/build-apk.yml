name: Build Android APK (Offline Qwen SLM)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android NDK & Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Ensure NDK and CMake are installed
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Scaffold React Native Project
        run: |
          npx -y @react-native-community/cli init BrightPathApp --skip-install --skip-git-init --pm npm
          cp -r mobile_app/src BrightPathApp/src
          cp -r mobile_app/assets BrightPathApp/assets
          cp mobile_app/App.js BrightPathApp/App.js

      - name: Configure Android for High-Memory SLM & Stability
        run: |
          # 1. Disable React Native New Architecture (ensures stable JNI bridge for llama.rn)
          sed -i 's/newArchEnabled=true/newArchEnabled=false/g' BrightPathApp/android/gradle.properties || true
          echo "newArchEnabled=false" >> BrightPathApp/android/gradle.properties

          # 2. Enable largeHeap (prevents Android OOM when loading 390MB model)
          sed -i 's/<application/<application android:largeHeap="true"/g' BrightPathApp/android/app/src/main/AndroidManifest.xml

          # 3. Do not compress GGUF (required for mmap to work without SIGBUS crashes)
          python3 -c "
          p = 'BrightPathApp/android/app/build.gradle'
          with open(p, 'r') as f:
              content = f.read()
          content = content.replace('android {', 'android {\n    aaptOptions { noCompress \"gguf\" }')
          with open(p, 'w') as f:
              f.write(content)
          "

      - name: Download Qwen 2.5 0.5B GGUF Model (~390 MB) into App Assets
        run: |
          mkdir -p BrightPathApp/android/app/src/main/assets
          curl -L -o BrightPathApp/android/app/src/main/assets/model.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -lh BrightPathApp/android/app/src/main/assets/model.gguf

      - name: Install App Dependencies & llama.rn
        working-directory: BrightPathApp
        run: |
          npm install
          npm install llama.rn@0.6.0

      - name: Pre-bundle Standalone Offline JavaScript (No Metro Needed)
        working-directory: BrightPathApp
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: Build Android Standalone APK
        working-directory: BrightPathApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp BrightPathApp/android/app/build/outputs/apk/debug/app-debug.apk ./BrightPath-Qwen-Offline.apk
          ls -lh ./BrightPath-Qwen-Offline.apk

      - name: Upload Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightPath-Qwen-Offline-App
          path: ./BrightPath-Qwen-Offline.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (Direct Mobile Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1
          name: BrightPath Mobile Offline v1.1
          body: |
            ### 📱 BrightPath Offline Tutor (Qwen 2.5 0.5B SLM) - v1.1

            - **Fixed immediate crash**:
              - Enabled `android:largeHeap="true"` to prevent Android Out-Of-Memory.
              - Set `aaptOptions { noCompress "gguf" }` to prevent SIGBUS crashes during model mmap.
              - Disabled New Architecture (`newArchEnabled=false`) for stable native C++ JNI bridge.
              - Added Error Boundary and delayed model loading.
            - **100% Offline & Standalone**: Model and JS bundle packaged inside.
          files: ./BrightPath-Qwen-Offline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
