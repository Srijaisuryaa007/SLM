name: Build Android APK (Offline Qwen SLM)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android NDK & Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Ensure NDK and CMake are installed
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Scaffold React Native Project
        run: |
          npx -y @react-native-community/cli init BrightPathApp --skip-install --skip-git-init --pm npm
          cp -r mobile_app/src BrightPathApp/src
          cp -r mobile_app/assets BrightPathApp/assets
          cp mobile_app/App.js BrightPathApp/App.js

      - name: Configure Android for High-Memory SLM
        run: |
          python3 -c "
          # 1. Enable largeHeap in AndroidManifest.xml
          manifest_path = 'BrightPathApp/android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = f.read()
          if 'android:largeHeap' not in manifest:
              manifest = manifest.replace('<application', '<application android:largeHeap=\"true\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(manifest)
          print('largeHeap enabled in manifest.')

          # 2. Add noCompress 'gguf' to android/app/build.gradle
          gradle_path = 'BrightPathApp/android/app/build.gradle'
          with open(gradle_path, 'r', encoding='utf-8') as f:
              gradle = f.read()
          if 'noCompress' not in gradle:
              gradle = gradle.replace('android {', 'android {\n    aaptOptions { noCompress \"gguf\" }')
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(gradle)
          print('noCompress gguf added to build.gradle.')
          "

      - name: Download Qwen 2.5 0.5B GGUF Model (~390 MB) into App Assets
        run: |
          mkdir -p BrightPathApp/android/app/src/main/assets
          curl -L -o BrightPathApp/android/app/src/main/assets/model.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -lh BrightPathApp/android/app/src/main/assets/model.gguf

      - name: Install App Dependencies & llama.rn
        working-directory: BrightPathApp
        run: |
          npm install
          npm install llama.rn@0.12.9

      - name: Patch llama.rn Android Native Asset Loader
        run: python3 patch_llama.py

      - name: Pre-bundle Standalone Offline JavaScript (No Metro Needed)
        working-directory: BrightPathApp
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: Build Android Standalone APK
        working-directory: BrightPathApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp BrightPathApp/android/app/build/outputs/apk/debug/app-debug.apk ./BrightPath-Qwen-Offline.apk
          ls -lh ./BrightPath-Qwen-Offline.apk

      - name: Upload Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightPath-Qwen-Offline-App
          path: ./BrightPath-Qwen-Offline.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (Direct Mobile Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.2
          name: English Class 9 AI Assistant v2.2 (Textbook MCQ Options a, b, c, d Display)
          body: |
            ### 📱 English Class 9 AI Assistant (Qwen 2.5 0.5B SLM) - v2.2

            - **Full Multiple Choice Question Options (a, b, c, d)**: When textbook questions have options, the AI renders every option (a, b, c, d) in an interactive card, highlighting the correct option in emerald green with a '✓ Correct' badge and direct answer banner.
            - **Complete Character Sketches & Summaries**: Answers questions like 'Write a character sketch of the spider' and poem summaries directly from the textbook without 'Not mentioned in the book' or disclaimers.
            - **Listening Comprehension Solutions**: Fills in listening blanks like 'Without trust there is no relationship at all' directly from the official Page 207 transcript.
            - **Strict Entity Domain Isolation**: Retains zero-hallucination isolation across all 5 units.
            - **100% Offline Standalone APK**: Pre-bundled JavaScript and Qwen 0.5B GGUF model (~688 MB).
          files: ./BrightPath-Qwen-Offline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
